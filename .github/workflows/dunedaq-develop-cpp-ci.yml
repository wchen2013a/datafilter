name: build-develop-datafilter-alma9

on:
  push:
    branches: 
      - develop
      - patch/*
      - prep-release/*
    paths-ignore:
      - 'docs/**'
      - '.github/**'
  pull_request:
    branches:
      - develop
      - patch/*
      - prep-release/*
  schedule:
    - cron: "08 22 * * *"
  workflow_dispatch:
    inputs:
      test_duration:
        description: 'Duration for continuous testing (in minutes)'
        required: false
        default: '60'
      test_interval:
        description: 'Interval between test runs (in seconds)'
        required: false
        default: '300'
      enable_continuous_test:
        description: 'Enable continuous testing'
        required: false
        type: boolean
        default: false

jobs:
  build_against_dev_release:
    name: Build DUNEDAQ DataFilter V5 on Alma9
    runs-on: ubuntu-latest
    timeout-minutes: 480
    strategy:
      matrix:
        include:
          - image: "almalinux:9"
            os_name: "alma9"
            link: "last_successful_alma9"
    container:
      image: ${{ matrix.image }}
      options: --privileged
    defaults:
      run:
        shell: bash
    
    steps:
      - name: Install CVMFS and dependencies
        run: |
          dnf install -y epel-release
          dnf install -y \
            https://ecsft.cern.ch/dist/cvmfs/cvmfs-release/cvmfs-release-latest.noarch.rpm
          dnf install -y cvmfs cvmfs-config-default
          dnf install -y --allowerasing git wget curl cmake gcc-c++ make python3 python3-pip fuse fuse-libs attr gdb strace
          
          # Setup CVMFS
          #mkdir -p /etc/cvmfs
          #cat > /etc/cvmfs/default.local <<EOF
          #CVMFS_REPOSITORIES=dunedaq.opensciencegrid.org,dunedaq-development.opensciencegrid.org
          #CVMFS_HTTP_PROXY=DIRECT
          #CVMFS_CLIENT_PROFILE=single
          #CVMFS_QUOTA_LIMIT=10000
          #EOF

          # Create cache directory
          #mkdir -p /var/cache/cvmfs
          
          # Setup CVMFS for each repository
          #for repo in dunedaq.opensciencegrid.org dunedaq-development.opensciencegrid.org; do
          #  mkdir -p /cvmfs/$repo
          #  echo "CVMFS_SERVER_URL=http://cvmfs-s1bnl.opensciencegrid.org:8000/cvmfs/@fqrn@" > /etc/cvmfs/domain.d/opensciencegrid.org.conf
          #done
          
          # Try to setup and mount CVMFS using cvmfs_config
          #cvmfs_config setup
          
          # Attempt mounting
          #echo "Attempting to mount CVMFS repositories..."
          #cvmfs_config probe dunedaq.opensciencegrid.org || echo "Failed to probe dunedaq.opensciencegrid.org"
          #cvmfs_config probe dunedaq-development.opensciencegrid.org || echo "Failed to probe dunedaq-development.opensciencegrid.org"
          
          # Manual mount as fallback
          #mount -t cvmfs dunedaq.opensciencegrid.org /cvmfs/dunedaq.opensciencegrid.org || echo "Manual mount failed for dunedaq"
          #mount -t cvmfs dunedaq-development.opensciencegrid.org /cvmfs/dunedaq-development.opensciencegrid.org || echo "Manual mount failed for dunedaq-development"

          # Verify CVMFS is mounted
          #ls -la /cvmfs/dunedaq.opensciencegrid.org/
          #ls /cvmfs/dunedaq-development.opensciencegrid.org/
          
          ################
          # Install cvmfsexec - a user-space CVMFS solution that doesn't require mounting
          cd /tmp
          git clone https://github.com/cvmfs/cvmfsexec
          cd cvmfsexec
          ./makedist osg
          
          # Create installation directory
          mkdir -p /opt/cvmfsexec
          tar -xzf cvmfsexec-*.tar.gz -C /opt/cvmfsexec
          
          # Setup cvmfsexec for dunedaq repositories
          cd /opt/cvmfsexec
          ./cvmfsexec dunedaq.opensciencegrid.org -- echo "Testing dunedaq access"
          ./cvmfsexec dunedaq-development.opensciencegrid.org -- echo "Testing dunedaq-development access"
          
          # Create wrapper script for easier access
          cat > /usr/local/bin/with-cvmfs <<'EOFSCRIPT'
          #!/bin/bash
          exec /opt/cvmfsexec/cvmfsexec dunedaq.opensciencegrid.org dunedaq-development.opensciencegrid.org -- "$@"
          EOFSCRIPT
          chmod +x /usr/local/bin/with-cvmfs
          
          # Test access
          echo "Testing CVMFS access via cvmfsexec:"
          with-cvmfs ls /cvmfs/dunedaq.opensciencegrid.org/ || echo "Failed to access dunedaq"
          with-cvmfs ls /cvmfs/dunedaq-development.opensciencegrid.org/ || echo "Failed to access dunedaq-development"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: ${{ github.repository }}
      
      - name: Setup dev area
        run: |
          #source /cvmfs/dunedaq.opensciencegrid.org/tools/dbt/latest/env.sh           
          #source `realpath /cvmfs/dunedaq.opensciencegrid.org/spack-externals/spack-installation/share/spack/setup-env.sh`
          #source /cvmfs/dunedaq.opensciencegrid.org/setup_dunedaq.sh
          #setup_dbt latest
          #pwd 
          #ls /cvmfs/dunedaq-development.opensciencegrid.org/candidates
          #mkdir test-area
          #dbt-create -b candidate fddaq-v5.3.2-rc3-a9 ./test-area
          with-cvmfs bash -c "source /cvmfs/dunedaq.opensciencegrid.org/tools/dbt/latest/env.sh && pwd && ls && dbt-create -b candidate fddaq-v5.3.2-rc3-a9 ."

      - name: Setup build environment
        run: |
          #source dbt-env.sh
          #dbt-workarea-env || true
          with-cvmfs bash -c "source dbt-env.sh && dbt-workarea-env || true"
          
      - name: Clone DUNEDAQ repositories
        run: |
          git clone https://github.com/DUNE-DAQ/daqsystemtest.git
          git clone https://github.com/DUNE-DAQ/fddaqconf.git 
          git clone https://github.com/DUNE-DAQ/hdf5libs.git 
          git clone https://github.com/DUNE-DAQ/detdataformats.git
          git clone https://github.com/DUNE-DAQ/fddetdataformats.git
          git clone https://github.com/DUNE-DAQ/datafilter.git 
          git clone https://github.com/DUNE-DAQ/appfwk.git
      
      - name: Checkout specific commits
        run: |
          cd fddaqconf
          git checkout 0575bb1ade1632c2679f4c33ca499a1dbf8175a1
          cd ..
          
          cd appfwk
          git checkout 1f8ce77ccdf23b8e068b8096218cfb26dd87d80e
          cd ..
          
          cd hdf5libs
          git checkout e1dc1f0b19bd64dbae5a36f5f525d70d4de4f6cb
          cd ..
          
          cd fddetdataformats
          git checkout 240f71fe8391a7d04db048f111e182ee8313de34
          cd ..
      
      - name: Setup DBT environment and build
        run: |
          source dbt-env.sh
          dbt-workarea-env
          dbt-build -j$(nproc)
      
      - name: Run tests (optional)
        run: |
          source dbt-env.sh
          dbt-workarea-env
          # Add your test commands here
          # dbt-test or other test commands
        continue-on-error: true
      
      - name: Continuous Testing
        if: ${{ github.event.inputs.enable_continuous_test == 'true' }}
        run: |
          source dbt-env.sh
          dbt-workarea-env
          
          DURATION=${{ github.event.inputs.test_duration }}
          INTERVAL=${{ github.event.inputs.test_interval }}
          END_TIME=$((SECONDS + DURATION * 60))
          TEST_COUNT=0
          FAILED_TESTS=0
          
          echo "Starting continuous testing for ${DURATION} minutes"
          echo "Test interval: ${INTERVAL} seconds"
          echo "=========================================="
          
          while [ $SECONDS -lt $END_TIME ]; do
            TEST_COUNT=$((TEST_COUNT + 1))
            CURRENT_TIME=$(date '+%Y-%m-%d %H:%M:%S')
            echo ""
            echo "=========================================="
            echo "Test Run #${TEST_COUNT} at ${CURRENT_TIME}"
            echo "=========================================="
            
            # Add your actual test commands here
            # Example test commands:
            # dbt-test
            # pytest tests/
            # ./run_integration_tests.sh
            
            if ! echo "Running test suite..."; then
              FAILED_TESTS=$((FAILED_TESTS + 1))
              echo "ERROR: Test run #${TEST_COUNT} failed!"
            else
              echo "SUCCESS: Test run #${TEST_COUNT} passed"
            fi
            
            REMAINING=$((END_TIME - SECONDS))
            if [ $REMAINING -gt $INTERVAL ]; then
              echo "Next test in ${INTERVAL} seconds..."
              sleep $INTERVAL
            else
              echo "Continuous testing period ending..."
              break
            fi
          done
          
          echo ""
          echo "=========================================="
          echo "Continuous Testing Summary"
          echo "=========================================="
          echo "Total test runs: ${TEST_COUNT}"
          echo "Failed tests: ${FAILED_TESTS}"
          echo "Success rate: $(( (TEST_COUNT - FAILED_TESTS) * 100 / TEST_COUNT ))%"
          
          if [ $FAILED_TESTS -gt 0 ]; then
            echo "WARNING: ${FAILED_TESTS} test runs failed"
            exit 1
          fi
      
      - name: Archive build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ matrix.os_name }}
          path: |
            build/
            log/
          retention-days: 7
      
      # Email notifications (currently disabled)
      # Uncomment and configure secrets to enable
      # - name: Send failure notification email
      #   if: failure()
      #   uses: dawidd6/action-send-mail@v3
      #   with:
      #     server_address: smtp.gmail.com
      #     server_port: 587
      #     username: ${{ secrets.EMAIL_USERNAME }}
      #     password: ${{ secrets.EMAIL_PASSWORD }}
      #     subject: "DUNEDAQ V5 CI Build Failed - ${{ github.repository }}"
      #     to: ${{ secrets.NOTIFICATION_EMAIL }}
      #     from: DUNEDAQ CI Bot
      #     body: |
      #       Build failed for DUNEDAQ V5 CI
      #       
      #       Repository: ${{ github.repository }}
      #       Branch: ${{ github.ref_name }}
      #       Commit: ${{ github.sha }}
      #       Author: ${{ github.actor }}
      #       Workflow: ${{ github.workflow }}
      #       Run: ${{ github.run_number }}
      #       
      #       View details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      #       
      #       Please check the logs for more information.
